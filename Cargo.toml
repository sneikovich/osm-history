[package]
name = "history"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "migrate", "macros"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
